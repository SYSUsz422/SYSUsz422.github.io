{{- $bvid := .Get "bvid" | default (.Get 0) -}}
{{- $page := .Get "page" | default 1 -}}
{{- $danmaku := .Get "danmaku" | default 0 -}}

<div style="position: relative; width: 100%; height: 0; padding-top: 56.25%; margin: 1.5rem 0;">
  <iframe
    src="//player.bilibili.com/player.html?bvid={{ $bvid }}&page={{ $page }}&as_wide=1&high_quality=1&danmaku={{ $danmaku }}"
    style="position: absolute; width: 100%; height: 100%; left: 0; top: 0; border: none;"
    scrolling="no"
    frameborder="0"
    allowfullscreen
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  ></iframe>
</div>
